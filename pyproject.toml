[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-memory"
version = "0.1.0"
description = "Reference implementation of HELM (Hierarchical Epistemic Learned Memory): SHNM store, epistemic governance, controller training, and a synthetic epistemic-trap benchmark."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.51"]
embed = ["sentence-transformers>=3.0"]
llm = ["openai>=1.0"]
ann = ["hnswlib>=0.8"]
plot = ["matplotlib>=3.7", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["helm*"]
